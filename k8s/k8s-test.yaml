---
apiVersion: v1
kind: Namespace
metadata:
  name: k8s-check
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: k8s-checker, namespace: k8s-check}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata: {name: k8s-checker}
rules:
- {apiGroups: [""],     resources: ["pods"],       verbs: ["get", "list"]}
- {apiGroups: ["apps"], resources: ["deployments"], verbs: ["get", "list"]}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata: {name: k8s-checker}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: k8s-checker}
subjects:
- {kind: ServiceAccount, name: k8s-checker, namespace: k8s-check}
---
apiVersion: v1
kind: Secret
metadata:
  name: k8s-check-token
  namespace: k8s-check
type: Opaque
stringData:
  TOKEN_KEY: "123"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: k8s-check
  namespace: k8s-check
  labels:
    app: k8s-check
spec:
  replicas: 1
  selector:
    matchLabels:
      app: k8s-check
  template:
    metadata:
      labels:
        app: k8s-check
    spec:
      containers:
        - name: k8s-check
          image: k8s-check:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          env:
            - name: TOKEN_KEY
              valueFrom:
                secretKeyRef:
                  name: k8s-check-token
                  key: TOKEN_KEY
      serviceAccountName: k8s-checker 
---
apiVersion: v1
kind: Service
metadata:
  name: k8s-check-svc
  namespace: k8s-check
spec:
  type: NodePort
  selector:
    app: k8s-check
  ports:
    - port: 80
      targetPort: 8000
      nodePort: 30080
